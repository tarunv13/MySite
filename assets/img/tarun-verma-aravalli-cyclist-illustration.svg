<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t d">
  <title id="t">Tarun Verma, conservation social scientist: illustration of a cyclist on a road through the Aravalli hills</title>
  <desc id="d">An ink and wash landscape of Rajasthan at dusk: layered green Aravalli hills, a saffron sun, birds in flight, and a cyclist on a winding road, framed by the corner marks of a camera viewfinder.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3ee"/>
      <stop offset=".55" stop-color="#f8e7c9"/>
      <stop offset="1" stop-color="#f6d9a8"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8cdb4"/>
      <stop offset="1" stop-color="#bfb193"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="268" cy="150" r="46" fill="#e9a53f" opacity=".9"/>
  <circle cx="268" cy="150" r="62" fill="#f2c27a" opacity=".25"/>
  <!-- birds -->
  <g fill="none" stroke="#1f2a24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".8">
    <path d="M96 92q8-7 15 0q7-7 15 0"/>
    <path d="M140 70q6-5 11 0q5-5 11 0"/>
    <path d="M122 118q5-4 9 0q4-4 9 0"/>
    <path d="M318 84q5-4 9 0q4-4 9 0"/>
  </g>
  <!-- hills, far to near -->
  <path d="M0 214 C40 186 70 180 104 196 S170 170 214 182 S300 160 340 178 S388 186 400 180 V400 H0Z" fill="#9fc6b2"/>
  <path d="M0 246 C36 222 80 216 120 232 S196 204 240 222 S330 206 400 228 V400 H0Z" fill="#6fa98b"/>
  <path d="M0 282 C50 262 96 262 140 276 S236 252 292 268 S370 262 400 272 V400 H0Z" fill="#3f8a67"/>
  <!-- khejri tree -->
  <g fill="#23513d">
    <rect x="66" y="238" width="4" height="36" rx="2"/>
    <ellipse cx="68" cy="236" rx="22" ry="10"/>
    <ellipse cx="58" cy="244" rx="12" ry="6"/>
    <ellipse cx="80" cy="243" rx="12" ry="6"/>
  </g>
  <path d="M0 316 C60 300 120 304 180 312 S300 300 400 310 V400 H0Z" fill="#2a6b4d"/>
  <!-- the road -->
  <path d="M168 400 C176 360 196 336 232 318 S300 292 314 282 L322 283 C312 296 272 316 250 330 S214 366 222 400Z" fill="url(#road)"/>
  <path d="M195 400 C200 368 216 346 244 330 S298 300 318 283" fill="none" stroke="#f7f3ea" stroke-width="2" stroke-dasharray="7 9" stroke-linecap="round"/>
  <!-- cyclist -->
  <g fill="none" stroke="#1f2a24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(212 300) scale(.92)">
    <circle cx="0" cy="40" r="15"/>
    <circle cx="48" cy="40" r="15"/>
    <path d="M0 40 L20 40 L36 20 L14 20 Z"/>
    <path d="M20 40 L12 12"/>
    <path d="M36 20 L48 40"/>
    <path d="M34 12 L40 12 L36 20"/>
    <path d="M7 12 H17"/>
    <path d="M13 11 L24 -8 L37 12" />
    <path d="M13 11 L22 26 L20 40"/>
    <circle cx="29" cy="-15" r="6" fill="#1f2a24"/>
  </g>
  <!-- viewfinder corners -->
  <g fill="none" stroke="#1f2a24" stroke-width="2.5" stroke-linecap="round" opacity=".55">
    <path d="M70 60 H50 V80"/>
    <path d="M330 60 H350 V80"/>
    <path d="M70 340 H50 V320"/>
    <path d="M330 340 H350 V320"/>
  </g>
</svg>
